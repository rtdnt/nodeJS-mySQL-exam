<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Window</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chatbot-window" role="dialog" aria-labelledby="chatbot-title" aria-describedby="chatbot-desc">
        <div class="chatbot-header">
            <span id="chatbot-title" class="chatbot-name">Virtual Advisor</span>
            <button class="chatbot-menu" aria-label="Open menu" aria-haspopup="true" aria-expanded="false">☰</button>
            <button class="chatbot-minimize" aria-label="Minimize chat window">-</button>
            <button class="chatbot-close" aria-label="Close chat window">×</button>
        </div>
        <div class="chatbot-menu-content" role="menu">
            <a href="https://seb.lt/privacy" target="_blank" role="menuitem">Privacy Policy</a>
            <a href="#" id="feedback-link" role="menuitem">Give Feedback</a>
        </div>
        <div class="chatbot-body" id="chatbot-desc">
            <div class="chatbot-messages" role="log" aria-live="polite" aria-relevant="additions text">
                <!-- Messages will be dynamically inserted here -->
            </div>
        </div>
        <div class="chatbot-input">
            <label for="chatbot-input-field" class="visually-hidden">Type your message</label>
            <input type="text" id="chatbot-input-field" aria-label="Type your message" placeholder="Type your message..." />
            <button class="chatbot-send" aria-label="Send message" id="sendBtn">Send</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
